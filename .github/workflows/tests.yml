name: Test PRs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.24'
          python-version: '3.10.22'
          activate-environment: true

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-py3.10.22-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: uv pip install pre-commit

      - name: Validate test groups
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path

          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/tests.yml').read_text())
          groups = workflow['jobs']['test']['strategy']['matrix']['include']
          assigned = Counter(path for group in groups for path in group['tests'].split())
          discovered = {
              path.relative_to('mlx_vlm').as_posix()
              for pattern in ('test_*.py', '*_test.py')
              for path in Path('mlx_vlm/tests').rglob(pattern)
          }
          errors = {
              'unassigned': sorted(discovered - assigned.keys()),
              'missing': sorted(assigned.keys() - discovered),
              'duplicates': sorted(path for path, count in assigned.items() if count > 1),
              'empty groups': [group['group'] for group in groups if not group['tests'].split()],
          }
          if any(errors.values()):
              raise SystemExit(f'Invalid test groups: {errors}')
          print(f'All {len(discovered)} test files are assigned exactly once.')
          PY

      - name: Run pre-commit checks
        run: |
          if ! pre-commit run --all-files; then
            echo 'Style checks failed, please install pre-commit and run pre-commit run --all-files and push the change'
            exit 1
          fi
          if ! git diff --quiet; then
            echo 'Style checks failed, please install pre-commit and run pre-commit run --all-files and push the change'
            exit 1
          fi

  test:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: interfaces
            suite: Server, CLI, sampling, tool streaming & generation
            os: ubuntu-24.04
            extras: 'test,cpu'
            tests: >-
              tests/test_cli.py
              tests/test_generate.py
              tests/test_sampling_defaults.py
              tests/test_server.py
              tests/test_server_stt_realtime.py
              tests/test_tool_streaming.py
          - group: training-ops
            suite: Training, cache, offloading & model operations
            os: macos-14
            extras: test
            # Keep cache pressure checks away from the larger model contracts.
            # Run the training API first so its compilation starts early.
            tests: >-
              tests/test_training_api.py
              tests/test_cache.py
              tests/test_model_ops.py
              tests/test_moe_offload.py
              tests/test_trainer.py
              tests/test_trainer_facades.py
              tests/test_training_batching.py
              tests/test_training_callbacks.py
              tests/test_training_cli.py
              tests/test_training_cross_entropy.py
              tests/test_training_data_loading.py
              tests/test_training_dataset_preparation.py
              tests/test_training_grpo.py
              tests/test_training_grpo_text_notebook.py
              tests/test_training_helpers.py
              tests/test_training_metrics.py
              tests/test_training_model_preparation.py
              tests/test_training_notebooks.py
              tests/test_training_vlm.py
          - group: models
            suite: Models, processors & speculation
            os: macos-14
            extras: test
            tests: >-
              tests/test_gated_delta.py
              tests/test_inkling_kernel_gates.py
              tests/test_models.py
              tests/test_muse_spark.py
              tests/test_muse_spark_kernels.py
              tests/test_oxr.py
              tests/test_processors.py
              tests/test_speculative.py
          - group: media
            suite: Diffusion, audio, images, video & extraction
            os: macos-14
            extras: test
            tests: >-
              tests/test_audio_models.py
              tests/test_diffusion_models.py
              tests/test_extraction_models.py
              tests/test_flux3.py
              tests/test_flux3_upsampler.py
              tests/test_image_generation_models.py
              tests/test_llada_image.py
              tests/test_moss_image.py
              tests/test_muse_spark_video.py
              tests/test_video_generation_models.py
          # Fork: the fork's own test files, which upstream's groups above do not
          # list. Split alphabetically into two shards; the "Validate test
          # groups" step requires every discovered file to be assigned once.
          - group: fork-a
            suite: Fork tests (a)
            os: macos-14
            extras: test
            tests: >-
              tests/fe_tokenizer_concurrency/test_contracts.py
              tests/fe_tokenizer_concurrency/test_copy_contracts.py
              tests/fe_tokenizer_concurrency/test_loaders_retry.py
              tests/fe_tokenizer_concurrency/test_races.py
              tests/test_apc.py
              tests/test_apc_all_models.py
              tests/test_apc_exact_mode.py
              tests/test_apc_settings.py
              tests/test_asymmetric_flag_per_request.py
              tests/test_atem_tool_parser.py
              tests/test_attention_policy.py
              tests/test_attention_policy_r1.py
              tests/test_attention_policy_r2.py
              tests/test_audit_scoped_exclusions.py
              tests/test_backend_label.py
              tests/test_batch_generate_zero_budget.py
              tests/test_batch_quantized_cache.py
              tests/test_batch_turboquant_attention.py
              tests/test_batch_zero_budget.py
              tests/test_body_divergence_check.py
              tests/test_cached_token_count.py
              tests/test_cached_token_count_endpoints.py
              tests/test_cached_tokens_reporting.py
              tests/test_call_argument_check.py
              tests/test_chat_request_contracts.py
              tests/test_cli_memory_limits.py
              tests/test_cohere_tool_parser.py
              tests/test_completions_endpoint.py
              tests/test_context_budget.py
              tests/test_cpu_test_isolation.py
              tests/test_draft_fail_loud.py
              tests/test_dropped_upstream_guards.py
              tests/test_epicache.py
              tests/test_epicache_batch.py
              tests/test_epicache_qwen3_5.py
              tests/test_fork_coverage_report.py
              tests/test_fork_marker_check.py
              tests/test_gemma4_tool_parser.py
              tests/test_generation_defaults.py
              tests/test_glm47_tool_parser.py
              tests/test_kv_cache_quantization.py
              tests/test_kv_prealloc.py
              tests/test_lazy_embeddings.py
              tests/test_load_model_mtp_weights.py
              tests/test_mistral3_text_embedding.py
              tests/test_mistral_tool_parser.py
              tests/test_model_registry.py
              tests/test_modernbert_fp16_mask.py
              tests/test_moe_expand.py
              tests/test_mtp_batch_fallbacks.py
              tests/test_mtp_batch_plain.py
              tests/test_mtp_exactness.py
              tests/test_mtp_inline_dispatch.py
              tests/test_mtp_profile.py
              tests/test_mtp_session_cancel.py
              tests/test_mtp_sidecar_discovery.py
              tests/test_mtp_split.py
              tests/test_mtp_stop_state.py
              tests/test_mtp_thinking_budget.py
              tests/test_mtp_verify_scan.py
              tests/test_mtp_verify_scan_generation.py
              tests/test_mtp_zero_budget.py
              tests/test_nemotron_h_language.py
              tests/test_nemotron_h_mtp.py
              tests/test_nemotron_h_rollback.py
          - group: fork-b
            suite: Fork tests (b)
            os: macos-14
            extras: test
            tests: >-
              tests/test_p369_phase2_compare.py
              tests/test_p369_phase2_kvmanifest.py
              tests/test_p369_phase2_moe.py
              tests/test_p369_phase2_observe.py
              tests/test_p369_phase2_oracle.py
              tests/test_p369_phase2_orchestrate.py
              tests/test_p369_phase2_procs.py
              tests/test_p369_phase2_registry_states.py
              tests/test_p369_phase2_telemetry.py
              tests/test_p369_phase2_worker.py
              tests/test_p400_perf_probe.py
              tests/test_p400_tq_width2.py
              tests/test_p405_cli_runtime_config.py
              tests/test_p415_qualify.py
              tests/test_p426_draft_counters_log.py
              tests/test_p426_qualify_predictor.py
              tests/test_p452_qualify_in_wrapper.py
              tests/test_prealloc_retire_trim.py
              tests/test_prefill_profile.py
              tests/test_prompt_cache_lifetime.py
              tests/test_prompt_end_retention.py
              tests/test_prompt_utils.py
              tests/test_pythonic_tool_parser.py
              tests/test_quant_sdpa_mask.py
              tests/test_quant_sdpa_mask_adversarial.py
              tests/test_qwen3_5_moe_sanitize.py
              tests/test_qwen3_5_mtp_sanitize.py
              tests/test_qwen3_5_patch_embed.py
              tests/test_qwen3_5_ragged_sdpa_fallback.py
              tests/test_qwen3_reranker_prompt.py
              tests/test_qwen4_mtp.py
              tests/test_registry_check.py
              tests/test_rewind_guard.py
              tests/test_rope.py
              tests/test_rope_utils.py
              tests/test_sample_utils.py
              tests/test_sampling_defaults_fork.py
              tests/test_sanitize_strict_json.py
              tests/test_seeded_cached_path.py
              tests/test_server_zero_budget_shortcut.py
              tests/test_session_cache.py
              tests/test_snapshot.py
              tests/test_speculative_prefill_fallback.py
              tests/test_speculative_quantized_kv.py
              tests/test_speculative_transactions.py
              tests/test_sse_serialization.py
              tests/test_ssm_with_states.py
              tests/test_structured.py
              tests/test_suffix_decoding.py
              tests/test_test_determinism.py
              tests/test_thinking_format_split.py
              tests/test_tokenizer_concurrency.py
              tests/test_tokenizer_utils.py
              tests/test_tool_registry.py
              tests/test_trim_cache_layouts.py
              tests/test_turboquant.py
              tests/test_turboquant_decode_2pass_toggle.py
              tests/test_turboquant_fused_prefill.py
              tests/test_turboquant_prod_codec.py
              tests/test_turboquant_rht_value_kernels.py
              tests/test_turboquant_storage_contract.py
              tests/test_untested_fork_code_scan.py
              tests/test_upstream_cache_structure.py
              tests/test_utils.py
              tests/test_vision_cache.py
              tests/test_zero_budget_logprobs.py
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.24'
          python-version: '3.10.22'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      - name: Install package and dependencies
        # Fork: cryptography is an optional runtime dependency here (compaction
        # capsules); install it so CI still runs the capsule contract tests.
        run: |
          uv pip install "cryptography>=43.0.0"
          uv pip install -e ".[${{ matrix.extras }}]"

      - name: Locate Metal compiler cache
        if: runner.os == 'macOS'
        id: metal
        run: |
          echo "path=$(getconf DARWIN_USER_CACHE_DIR)" >> "$GITHUB_OUTPUT"
          echo "version=$(sw_vers -buildVersion)-$(python -c 'import importlib.metadata; print(importlib.metadata.version("mlx"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Metal compilation
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.metal.outputs.path }}/com.apple.metal
            ${{ steps.metal.outputs.path }}/com.apple.metalfe
          key: metal-${{ runner.arch }}-${{ steps.metal.outputs.version }}-${{ matrix.group }}-${{ hashFiles('mlx_vlm/**/*.py', 'mlx_vlm/**/*.json', '.github/workflows/tests.yml') }}
          restore-keys: |
            metal-${{ runner.arch }}-${{ steps.metal.outputs.version }}-${{ matrix.group }}-
            metal-${{ runner.arch }}-${{ steps.metal.outputs.version }}-

      - name: Run Python tests
        working-directory: mlx_vlm
        env:
          TEST_FILES: ${{ matrix.tests }}
        run: |
          read -r -a tests <<< "$TEST_FILES"
          python -m pytest -q -n 3 --dist=worksteal --durations=30 \
            -k 'not test_distributed_model' \
            --junitxml=../test-results/${{ matrix.group }}.xml "${tests[@]}"

      # Each distributed case launches multiple GPU processes. Keep these out
      # of the xdist pool to avoid oversubscribing the runner's single GPU.
      - name: Run distributed model tests
        if: matrix.group == 'models'
        working-directory: mlx_vlm
        run: |
          python -m pytest -q tests/test_models.py -k test_distributed_model \
            --durations=12 --junitxml=../test-results/models-distributed.xml

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.group }}
          path: test-results/${{ matrix.group }}*.xml
          retention-days: 14
