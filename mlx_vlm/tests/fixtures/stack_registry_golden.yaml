# the golden test. REFRESH when the stack registry changes: copy the file below the marker, update
# the recorded sha in the test, and re-check the first-pick expectations. The tests FAIL when the
# recorded sha does not match this file, and only WARN when a sibling registry differs from it.
# ---- BEGIN VERBATIM main_models.yaml ----
