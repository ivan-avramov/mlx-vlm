# 1 Qwen3.8-27B-Fable-Distill-OptiQ-4.5bpw-mixed @t0.5 medium, certified MTP (C61/M36 2026-09-10).
# 2 Qwen3.8-27B-mlx-uniform-4bit @t0.6 medium, certified MTP.
# 3 Ornith-1.0-35B-mlx-uniform-4bit @t0.4 native routing, certified MTP.
# 4 Qwen3.6-27B-Opus-Distill-OptiQ-4bit @deployed, certified MTP.
# C ORDER RULED C70 2026-09-12 (amends C69 after the length-controlled re-analysis: the two Qwen3.8-27B checkpoints are  # allow-shorthand
# EQUIVALENT at equal length, adjusted +0.25 CI [-0.76, +0.91]; every other M38 panel ordering survives adjustment):
# 1 Qwen3.8-27B-Fable-Distill-OptiQ-4.5bpw-mixed @t0.5 medium, repaired MTP (also B 1st: one resident model; 0.6x tokens, 0.7x latency).
