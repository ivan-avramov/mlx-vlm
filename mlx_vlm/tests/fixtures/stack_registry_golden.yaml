    max_kv_cache_size: 262144
    kv_prealloc_tokens: 262144   # restored to cap (standing rule) — at TQ4 width the floor is ~4GB/session, bounded by MLX_VLM_CACHE_SESSION_MAX=2
    # KV = deployed convention (operator ruling 2026-08-17: measure at expected deployment
