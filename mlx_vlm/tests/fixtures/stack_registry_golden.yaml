  - name: Qwen3.8-27B-mlx-uniform-4bit
    type: vision
    on_demand: true
    hf_path: caslca/Qwen3.8-27B-mlx-uniform-4bit  # IDENTICAL to the official mlx-community/Qwen3.8-27B-4bit
    # (proven 2026-08-26, M23 closure: full-tensor md5 sweep, 2179/2180 tensors bit-identical — MLX uniform
    # 4-bit gs64 quantization is deterministic, both quants derive from the same bf16 base). This copy is
